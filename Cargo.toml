# The engine itself is this crate. Only the file-format readers are split out,
# because those are the parts another project could use on their own; the
# runtime around them is one ordinary crate with ordinary modules.
[package]
name = "daysengine"
description = "A cross-platform reimplementation of Overflow's FILMEngine."
version.workspace = true
edition.workspace = true
license.workspace = true
# Not the workspace value: the engine uses `as_chunks`, stable since 1.88. The
# format-reader crates under crates/ are held to the lower workspace figure.
rust-version = "1.88"
repository.workspace = true

[dependencies]
days-gpk = { path = "crates/days-gpk", version = "=0.1.0" }
days-script = { path = "crates/days-script", version = "=0.1.0" }
days-font = { path = "crates/days-font", version = "=0.1.0" }
days-ui = { path = "crates/days-ui", version = "=0.1.0" }
days-save = { path = "crates/days-save", version = "=0.1.0" }
days-route = { path = "crates/days-route", version = "=0.1.0" }
miniz_oxide.workspace = true
rusty_ffmpeg = { workspace = true, features = ["link_system_ffmpeg"] }
sdl3.workspace = true
png.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true

[features]
# **On by default**, because every build here links the pinned SDL3 in
# third_party/, built by tools/build-sdl.sh into target/sdl/linux -- a developer
# build as much as a release archive. SDL3's zlib licence attaches no condition
# to linking it in, so it goes inside the executable and no libSDL3 ships or has
# to be found at run time.
#
# ffmpeg deliberately does NOT get the same treatment. It is LGPL v2.1, which
# permits static linking only against an obligation to let the player relink, so
# it stays shared -- see the licensing note at the top of tools/build-ffmpeg.sh.
# Only an LGPL library is dynamic here; that is the whole rule.
#
# `--no-default-features` links a *shared* SDL3 instead. On its own that still
# resolves against the vendored prefix, which is static-only and will not
# satisfy it; reaching the distribution's copy means pointing PKG_CONFIG_LIBDIR
# back at the system's own pkgconfig directory, over .cargo/config.toml.
default = ["static-sdl"]
static-sdl = ["sdl3/static-link"]

# One binary. The inspection tools used to be a second one, `days`; they are
# subcommands of this now (see the note atop src/inspect.rs).
[[bin]]
name = "daysengine"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
repository = "https://github.com/superboo07/DaysEngine"

# ---------------------------------------------------------------------------
# Dependency policy
#
# Every direct dependency is pinned to an EXACT version with `=`. Cargo's
# default caret requirement ("1.2.3" means ">=1.2.3, <2.0.0") would let a fresh
# checkout silently pull code nobody here has read. `=` plus the committed
# Cargo.lock means a clone builds the same bytes today and in two years.
#
# Transitive dependencies are pinned by Cargo.lock, which is committed. Always
# build with `--locked` (see `just` recipes and CI) so a stale or tampered lock
# is an error rather than something Cargo quietly rewrites.
#
# Adding or bumping a dependency is a reviewed change: see docs/DEPENDENCIES.md
# for the audit checklist and the rationale for each crate below.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Pure-Rust DEFLATE. Used for GPK index/entry decompression. No C, no unsafe-heavy
# codepaths, and it is the same inflate implementation flate2 defaults to.
miniz_oxide = { version = "=0.9.1", features = ["std"] }

# derive(Error) boilerplate only. Compile-time only, no runtime surface.
thiserror = "=2.0.20"

# Error propagation in the binaries only. Libraries use typed `thiserror` enums
# so callers can match on failure modes; `anyhow` never appears in a lib crate.
anyhow = "=1.0.104"

# Logging facade + the only backend we link. env_logger is binary-only.
log = "=0.4.34"
env_logger = "=0.11.11"

# Route-graph and config serialization.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# CLI for the offline asset/route tools. Binary-only.
clap = { version = "=4.6.6", features = ["derive", "env"] }

# Window, input, GPU present and audio output. Links the system libSDL3.
sdl3 = "=0.20.0"

# Raw bindgen bindings against the SYSTEM ffmpeg. Chosen over ffmpeg-next because
# it generates bindings at build time and therefore tracks whatever libav* the
# host actually ships, instead of lagging behind releases.
rusty_ffmpeg = "=0.17.0"

# Pure-Rust PNG decode for backgrounds and UI art.
png = "=0.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# A debug build has to be playable, because playing it is how this engine is
# checked against the real game.
#
# `[profile.dev.package."*"]` is **dependencies only**: in a workspace it does
# not cover the workspace's own members. So this table gave miniz_oxide and png
# their -O2 and left every line we wrote -- the resampler, the mixer, the
# compositor, the archive decrypt, the glyph decode -- at opt-level 0, which is
# where all of the per-pixel and per-sample work actually lives. Measured on
# this machine, with the workspace at 0 against the same code at 1:
#
#   800x450 still resampled to 1920x1080     524 ms  ->    18 ms
#   menu screen's base blit at 1920x1080     104 ms  ->   9.2 ms
#   one 1024-frame audio callback             82 us  ->     4 us
#
# 1 rather than 2 because it is nearly all of the win for a fraction of the
# compile time, and a build that is still worth stepping through.
[profile.dev]
opt-level = 1

# Dependencies get more: nothing here is stepped through, and the media and
# decompression crates are hot.
[profile.dev.package."*"]
opt-level = 2
