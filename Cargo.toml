# The engine itself is this crate. Only the file-format readers are split out,
# because those are the parts another project could use on their own; the
# runtime around them is one ordinary crate with ordinary modules.
[package]
name = "daysengine"
description = "A cross-platform reimplementation of Overflow's FILMEngine."
version.workspace = true
edition.workspace = true
license.workspace = true
# Not the workspace value: the engine uses `as_chunks`, stable since 1.88. The
# format-reader crates under crates/ are held to the lower workspace figure.
rust-version = "1.88"
repository.workspace = true

[dependencies]
days-gpk = { path = "crates/days-gpk", version = "=0.1.0" }
days-script = { path = "crates/days-script", version = "=0.1.0" }
days-font = { path = "crates/days-font", version = "=0.1.0" }
days-ui = { path = "crates/days-ui", version = "=0.1.0" }
days-save = { path = "crates/days-save", version = "=0.1.0" }
days-route = { path = "crates/days-route", version = "=0.1.0" }
miniz_oxide.workspace = true
rusty_ffmpeg = { workspace = true, features = ["link_system_ffmpeg"] }
sdl3.workspace = true
png.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true

[features]
# Link SDL3 into the executable rather than against a shared libSDL3.
#
# Off by default, because a developer build links whatever SDL3 the machine has
# and no distribution ships a static one. tools/dist.sh turns it on: an archive
# is a drag-and-drop, and SDL3's zlib licence attaches no condition to linking
# it in. ffmpeg deliberately does NOT get the same treatment -- see the
# licensing note at the top of tools/build-ffmpeg.sh.
static-sdl = ["sdl3/static-link"]

# One binary. The inspection tools used to be a second one, `days`; they are
# subcommands of this now (see the note atop src/inspect.rs).
[[bin]]
name = "daysengine"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
repository = "https://github.com/superboo07/DaysEngine"

# ---------------------------------------------------------------------------
# Dependency policy
#
# Every direct dependency is pinned to an EXACT version with `=`. Cargo's
# default caret requirement ("1.2.3" means ">=1.2.3, <2.0.0") would let a fresh
# checkout silently pull code nobody here has read. `=` plus the committed
# Cargo.lock means a clone builds the same bytes today and in two years.
#
# Transitive dependencies are pinned by Cargo.lock, which is committed. Always
# build with `--locked` (see `just` recipes and CI) so a stale or tampered lock
# is an error rather than something Cargo quietly rewrites.
#
# Adding or bumping a dependency is a reviewed change: see docs/DEPENDENCIES.md
# for the audit checklist and the rationale for each crate below.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Pure-Rust DEFLATE. Used for GPK index/entry decompression. No C, no unsafe-heavy
# codepaths, and it is the same inflate implementation flate2 defaults to.
miniz_oxide = { version = "=0.9.1", features = ["std"] }

# derive(Error) boilerplate only. Compile-time only, no runtime surface.
thiserror = "=2.0.20"

# Error propagation in the binaries only. Libraries use typed `thiserror` enums
# so callers can match on failure modes; `anyhow` never appears in a lib crate.
anyhow = "=1.0.104"

# Logging facade + the only backend we link. env_logger is binary-only.
log = "=0.4.34"
env_logger = "=0.11.11"

# Route-graph and config serialization.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

# CLI for the offline asset/route tools. Binary-only.
clap = { version = "=4.6.6", features = ["derive", "env"] }

# Window, input, GPU present and audio output. Links the system libSDL3.
sdl3 = "=0.20.0"

# Raw bindgen bindings against the SYSTEM ffmpeg. Chosen over ffmpeg-next because
# it generates bindings at build time and therefore tracks whatever libav* the
# host actually ships, instead of lagging behind releases.
rusty_ffmpeg = "=0.17.0"

# Pure-Rust PNG decode for backgrounds and UI art.
png = "=0.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
# Asset decode is unusably slow in a debug build; dependencies always get -O2.
[profile.dev.package."*"]
opt-level = 2
