plugins {
    id 'com.android.application'
}

// The minimum Android, read out of the file that decides it rather than
// spelled a second time: tools/build-sdl.sh sets ANDROID_API and both C
// libraries are compiled against it, so a number typed here that disagreed
// would be an app that installs on a device its own libraries cannot run on.
def androidApi = Integer.parseInt(
    file("${rootDir}/../tools/build-sdl.sh").readLines()
        .find { it.startsWith('ANDROID_API=') }
        .substring('ANDROID_API='.length()).trim())

// The engine's version, for the same reason and out of the same kind of file:
// Cargo.toml's [workspace.package] is what every other artifact this project
// builds is stamped with, and a number typed here would be a second place to
// remember on a bump -- which is exactly how this line came to read 0.1.0 while
// the engine inside the APK was 0.2.x. It throws rather than falling back to a
// default, because an APK whose version silently disagrees with its own engine
// is worse than a build that stops.
def cargoToml = file("${rootDir}/../Cargo.toml").readLines()
def workspaceStart = cargoToml.findIndexOf { it.trim() == '[workspace.package]' }
if (workspaceStart < 0) {
    throw new GradleException("no [workspace.package] in Cargo.toml")
}
def versionLine = cargoToml.subList(workspaceStart + 1, cargoToml.size())
    .find { it ==~ /^version\s*=\s*".*"\s*$/ }
if (versionLine == null) {
    throw new GradleException("no version in Cargo.toml's [workspace.package]")
}
def engineVersion = (versionLine =~ /"(.*)"/)[0][1]

// Which build of that version this is: the short commit, plus `-dirty` when the
// working tree had changes git did not. tools/build-android.sh computes it --
// it is the same string it names the APK file after, so the file and the
// version the device shows cannot disagree -- and passes it in rather than this
// file shelling out to git a second time. The fallback is the script's own for
// a checkout with no git: `unknown`.
def buildId = project.findProperty('daysengine.version') ?: 'unknown'

// And the number Android itself compares when deciding whether an install is
// an upgrade -- versionName is only ever shown to a person. The same script
// derives it from the commit count, for the reasons written down beside it
// there; 1 is the floor Android accepts and what a checkout with no git gets.
def buildCode = Integer.parseInt(
    (project.findProperty('daysengine.versionCode') ?: '1').toString())

android {
    namespace 'org.daysengine'
    compileSdk 35

    // Pinned rather than left to the plugin's default. Without this, AGP
    // reaches for a version of its own choosing and **downloads it mid-build**
    // -- which is the one thing tools/dist/Dockerfile exists to prevent, and
    // which the --rm build container would then repeat on every single build.
    // The version here is the one the image installs.
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'org.daysengine'
        minSdk androidApi
        targetSdk 35
        versionCode buildCode
        versionName "${engineVersion}-${buildId}"
    }

    sourceSets {
        main {
            // SDL's Java half, compiled from the pinned submodule rather than
            // copied in. SDLActivity, SDLSurface and SDLAudioManager are the
            // other side of libSDL3.so's native methods, and the two have to
            // come from the same SDL.
            java.srcDirs += '../../third_party/sdl/android-project/app/src/main/java'
            // Built by tools/build-android.sh, under target/ with every other
            // build output. Gradle packages whatever it finds here.
            jniLibs.srcDirs = ['../../target/android/jniLibs']
            // ffmpeg's licence and upstream commit, SDL3's notice, this
            // engine's licence, and the source this APK was built from. An APK
            // is one file, so a compliance artifact that did not travel inside
            // it would not travel at all.
            assets.srcDirs = ['../../target/android/assets']
        }
    }

    // **Both build types are signed, with whichever key the build was pointed
    // at.** Android will not install an unsigned APK at all -- it refuses with
    // "the package appears to be invalid" -- so an unsigned release is not a
    // release anybody can run, only one they have to repair first.
    //
    // Named outright rather than left to the plugin, which would generate a
    // throwaway key in $HOME on every build; see the long note in
    // tools/build-android.sh, which is what creates the default one. That
    // default is the standard Android debug credential, and it is **not a
    // secret** -- it is what every Android SDK generates, and no keystore is
    // ever committed here.
    //
    // A publisher substitutes their own by pointing DAYS_ANDROID_KEYSTORE at
    // it and setting the three credentials beside it; the repository still
    // never sees that key. The properties are how tools/build-android.sh
    // passes all four through, and the defaults keep a bare
    // `gradle assembleDebug` working.
    signingConfigs {
        days {
            storeFile file(project.findProperty('daysengine.keystore')
                ?: "${rootDir}/../target/android/debug.keystore")
            storePassword project.findProperty('daysengine.storepass') ?: 'android'
            keyAlias project.findProperty('daysengine.keyalias') ?: 'androiddebugkey'
            keyPassword project.findProperty('daysengine.keypass') ?: 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.days
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.days
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // The libraries are opened by the dynamic linker from the APK
            // itself rather than unpacked first, which is what modern Android
            // wants and what keeps the install half the size.
            useLegacyPackaging false
        }
    }

    lint {
        abortOnError false
    }
}
