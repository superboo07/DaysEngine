org.gradle.jvmargs=-Xmx2g
android.useAndroidX=false
# Nothing here is built by gradle's own NDK integration. The shared objects
# come from tools/build-android.sh, which drives cargo and the two vendored C
# libraries; gradle only packages what it finds in jniLibs.

# **A missing SDK component is an error, not a download.** Left on, AGP quietly
# fetches whatever platform or build-tools it decided it wanted, from the
# network, in the middle of the build -- so what went into an APK would depend
# on when it was built rather than on tools/dist/Dockerfile, and the --rm build
# container would refetch it every time. Everything this build needs is pinned
# and installed in the image.
android.builder.sdkDownload=false
