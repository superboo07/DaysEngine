# The devcontainer, run by **rootless Podman** (`podman compose`), and the reason
# it is compose rather than a plain image: the
# game installs are mounted from paths that differ on every machine, and compose
# is what reads .env for them. That file is at the **top of the repository**, not
# beside this one, because launch.json and a plain shell read it too; compose
# looks for .env next to the compose file, so devcontainer.json's
# initializeCommand links it here before any of this runs. See .env.example.
#
# A variable that is not set falls back to a path that exists and holds nothing,
# so the container still comes up; `daysengine` then reports no install rather
# than the runtime creating an empty directory where the game was meant to be.
services:
  dev:
    # Built by initialize.sh on the host, not by compose -- see the comment
    # there for why a `build:` section here breaks the Dev Containers build.
    # Outside VS Code, run .devcontainer/initialize.sh before `podman compose
    # up`. `never` so a missing image is an error, not a pull of whatever
    # someone else published under this name.
    image: localhost/daysengine-devcontainer:latest
    pull_policy: never
    command: sleep infinity
    init: true

    # Root in here, which rootless Podman maps to your own host user: files
    # written into the bind-mounted tree, and into the game installs, stay
    # owned by you.

    # **The same two values, inside the container.** `daysengine`'s inspection
    # subcommands read DAYS_GAME_DIR for their --game default (src/inspect.rs),
    # and VS Code resolves ${env:...} in .vscode/launch.json out of this. They
    # are set here rather than in devcontainer.json's containerEnv because the
    # values come from .env, and compose is what reads that.
    environment:
      DAYS_GAME_DIR: ${DAYS_GAME_DIR:-}
      DAYS_SHINYDAYS_DIR: ${DAYS_SHINYDAYS_DIR:-}

    volumes:
      - ..:/workspaces/DaysEngine

      # **The player's install.** Nothing in this project ships game data: the
      # archive key comes from their SCHOOLDAYS HQ.exe and the widget tables from
      # their SysMenuSDHQ.dll, so the container is useless without the real
      # thing mounted. Read-write by default because playing writes saves --
      # a deliberate exception to inputs being read-only, chosen so the game is
      # playable in here; set DAYS_MOUNT_MODE=ro in .env to work against an
      # install nothing can touch.
      #
      # **Each install is mounted at its own path**, not at a path of the
      # container's choosing. One value in .env is then correct on the host and
      # in here alike, so launch.json, a shell and this file can all read
      # the same file and none of them has to translate between two spellings of
      # the same directory. tools/in-container.sh mounts the source tree the same
      # way, and for a related reason: a path that means one thing outside and
      # another inside is a path that ends up baked into something.
      #
      # Unset, each falls back to the empty /var/empty, mounted at a target of
      # its own: the same target twice is a duplicate mount and `up` fails.
      - ${DAYS_GAME_DIR:-/var/empty}:${DAYS_GAME_DIR:-/mnt/no-game-dir}:${DAYS_MOUNT_MODE:-rw}
      - ${DAYS_SHINYDAYS_DIR:-/var/empty}:${DAYS_SHINYDAYS_DIR:-/mnt/no-shinydays-dir}:${DAYS_MOUNT_MODE:-rw}

      # The desktop session, so the game can be run from in here rather than
      # only built. Only the Wayland socket, renamed to the fixed wayland-0
      # that containerEnv points WAYLAND_DISPLAY at. **The host's X server is
      # not bound**: reaching it needs your xauth cookie, which is a host
      # secret, and SDL3 drives Wayland natively.
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/run/user/0/wayland-0
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pipewire-0:/run/user/0/pipewire-0
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/pulse/native:/run/user/0/pulse/native

      # **Gamepads.** A pad reaches SDL through evdev, and evdev is not the
      # Wayland socket -- which is why a keyboard works in a container and a
      # controller never does without this. The directory is bound rather than
      # the nodes so one plugged in later appears, and /run/udev with it so SDL
      # can use udev instead of falling back to watching the directory.
      - /dev/input:/dev/input
      - /run/udev:/run/udev:ro

      # **The Ghidra project**, which holds the user's own game binaries and so
      # can never be in this repository. A plain name here is a named volume, a
      # path is a bind -- so the default keeps imports across rebuilds, and
      # setting DAYS_GHIDRA_PROJECT_DIR in .env uses a project you already have
      # instead. Analysing SCHOOLDAYS HQ.exe takes long enough that re-importing
      # it per rebuild is not an option.
      - ${DAYS_GHIDRA_PROJECT_DIR:-daysengine-ghidra}:/root/ghidra_projects

      # Podman's image store, on a volume: the build image it holds is not free
      # to make again, and overlay cannot stack on this container's own overlay
      # root -- on a volume it is native overlay, no fuse (see the Dockerfile).
      - daysengine-containers:/var/lib/containers
      # Shell history, and the crates the build downloads, across rebuilds.
      - daysengine-bashhistory:/commandhistory
      - daysengine-cargo:/usr/local/cargo/registry
      # The compiler rust-toolchain.toml pins. The image installs rustup and no
      # toolchain (see .devcontainer/Dockerfile), so this is what keeps a
      # rebuild from downloading it again.
      - daysengine-rustup:/usr/local/rustup

      # **No credential is bound in from the host.** No ~/.ssh, no ~/.gitconfig,
      # no Claude login: each of those is a volume the container owns and you
      # fill in once, from inside. A key generated or pasted in here stays here
      # and survives a rebuild, and a host key is never exposed to anything
      # running in the container. The exceptions are your skills and installed
      # plugins, below, which are read-only and hold no secret.
      #
      # git's global config is a volume too, and containerEnv points
      # GIT_CONFIG_GLOBAL into it -- which is also what makes the copy of the
      # host's ~/.gitconfig that the Dev Containers extension drops in inert.
      # HTTP(S) push credentials land in it as well (the Dockerfile's
      # credential.helper), so they survive a rebuild too.
      # Set your identity once, in here:
      #     git config --global user.name  "..."
      #     git config --global user.email "..."
      - daysengine-ssh:/root/.ssh
      - daysengine-gitconfig:/root/.config/git
      # **The Android signing key**, which is a credential and so follows the
      # rule above: a volume the container owns, generated once from inside,
      # never bound in from the host.
      #
      # It is on a volume rather than under target/ for a reason the other
      # build outputs do not have. Every APK this project builds is signed --
      # Android installs no unsigned one -- and it must be the same key every
      # time or `adb install` over the last one fails with "signatures do not
      # match", and the only way forward is uninstalling, which on this app
      # throws away the player's folder grant with it. A key that a
      # `cargo clean` can delete is a key that will be deleted.
      #
      # /root/.android is where Android's own tooling keeps this, so anything
      # else that writes there lands on the volume too. devcontainer.json's
      # DAYS_ANDROID_KEYSTORE points tools/build-android.sh at it, and
      # tools/in-container.sh carries it into the build container.
      - daysengine-android:/root/.android
      # Claude Code's credentials, settings and per-project history, so a
      # rebuild does not ask you to log in again.
      - daysengine-claude:/root/.claude
      # Your own skills, read-only, over the volume above -- the one thing that
      # does come from the host, because a skill is something you wrote and want
      # in here, not a credential. Read-only so nothing in the container can
      # edit them, and a bind rather than a copy so editing them on the host
      # takes effect without a rebuild. The shorter path is mounted first, so
      # this lands inside the volume rather than being hidden by it.
      - ${HOME}/.claude/skills:/root/.claude/skills:ro
      # Your installed plugins, read-only, the same way: install and update them
      # on the host. Mounted twice because installed_plugins.json and
      # known_marketplaces.json record absolute host paths -- the host path makes
      # those resolve, the /root one is where CLAUDE_CONFIG_DIR looks for the
      # manifests. enable-plugins.sh enables each in this container's settings.
      - ${HOME}/.claude/plugins:/root/.claude/plugins:ro
      - ${HOME}/.claude/plugins:${HOME}/.claude/plugins:ro
      # Plugins' own persistent state (CLAUDE_PLUGIN_DATA) must be writable, and
      # is the container's, never the host's.
      - daysengine-claude-plugindata:/root/.claude/plugins/data

    # The GPU. The container renders on the host's card through /dev/dri; with
    # no card passed through, Mesa falls back to lavapipe and the game still
    # draws, slowly.
    devices:
      - /dev/dri:/dev/dri

    # **Gamepads, continued.** Rootless Podman applies no device cgroup, so
    # whether a bound /dev/input node opens is decided by its file permissions
    # alone: owner root, group `input`. You are in `input` on the host;
    # container root is your uid but with no supplementary groups, so every
    # open is EACCES and SDL reports no gamepads. keep-groups carries your host
    # groups into the container (and into `podman exec`, so Claude's and VS
    # Code's shells too). **It needs crun as the host's OCI runtime**
    # (run.oci.keep_original_groups); under runc it is accepted and does
    # nothing. Measured with crun 1.30: all /dev/input nodes open. That
    # includes keyboards and mice, as the Docker container's cgroup rule did --
    # the price of pads, which this project treats as accessibility.
    group_add:
      - keep-groups

    # SYS_ADMIN and seccomp=unconfined are **podman's, so container builds work
    # in here** (tools/in-container.sh, and the Dockerfile's podman layer).
    # The host's Podman is rootless: both apply inside the user namespace it
    # gives this container, never to the host. SYS_ADMIN is for nested
    # podman's mounts and namespaces; unconfined because the default profile
    # still denies crun's pivot_root. SYS_PTRACE is gdb/lldb attaching.
    # label=disable because SELinux labels would deny the bind mounts where
    # SELinux is enforcing. No container socket, no --privileged.
    cap_add:
      - SYS_ADMIN
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
      - label=disable

# Explicit names: the compose project name the dev container tooling picks
# differs between compose providers (docker-compose: `<dir>_devcontainer`,
# podman-compose: `<dir>devcontainer`), and compose prefixes unnamed volumes
# with it -- a switch of provider would silently start from empty volumes.
volumes:
  daysengine-containers:
    name: daysengine-containers
  daysengine-bashhistory:
    name: daysengine-bashhistory
  daysengine-cargo:
    name: daysengine-cargo
  daysengine-rustup:
    name: daysengine-rustup
  daysengine-ssh:
    name: daysengine-ssh
  daysengine-gitconfig:
    name: daysengine-gitconfig
  daysengine-claude:
    name: daysengine-claude
  daysengine-claude-plugindata:
    name: daysengine-claude-plugindata
  daysengine-ghidra:
    name: daysengine-ghidra
  daysengine-android:
    name: daysengine-android
