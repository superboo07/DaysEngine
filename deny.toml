# cargo-deny configuration. Run with:  cargo deny --locked check
# CI treats every warning here as a failure.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
# RustSec advisory database. Anything unmaintained, yanked or vulnerable fails.
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
version = 2
# Permissive licenses only. The engine itself is MIT; we do not want a copyleft
# crate creeping in through a transitive edge.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.93
exceptions = []
# The allow list is aspirational: it lists what we would accept, not only what
# the current graph happens to use. Unused entries are not a problem.
unused-allowed-license = "allow"

[bans]
# Two versions of the same crate usually means an unreviewed transitive bump
# slipped in. Make it visible.
multiple-versions = "warn"
wildcards = "deny"
# Our own crates are path deps without versions; the wildcard ban is there to
# catch third-party `*` requirements, not internal workspace edges.
allow-wildcard-paths = true
# Crates we never want pulled in, with the reason.
deny = [
    # Unmaintained and superseded; frequent source of advisories.
    { name = "time", version = "<0.3" },
]
skip = []
skip-tree = []

[sources]
# Only crates.io. No git dependencies, no alternate registries: both bypass the
# crates.io immutability guarantee that makes the lockfile meaningful.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
